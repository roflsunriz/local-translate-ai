name: 機能提案
title: '[Feature] '
description: 新機能や改善の提案はこちら
labels:
  - enhancement
  - needs triage
body:
  - type: markdown
    attributes:
      value: |-
        誰のどの問題を解決するかと、提案・代替案・互換性を共有してください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/local-translate-ai/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/local-translate-ai/blob/HEAD/SECURITY.md) を確認してください。
  - type: markdown
    attributes:
      value: |
        新しいアイデアや改善点を教えてください。背景や目的が分かると検討しやすくなります。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の既存Issueを検索しました。
          required: true
        - label: READMEと関連する利用・更新手順を確認しました。
          required: true
  - type: input
    id: title
    attributes:
      label: タイトル
      description: 簡潔な件名を入力してください
      placeholder: 例）翻訳結果のコピーをワンクリックにしたい
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 解決したい問題
      description: どんな状況で困っているのか、解決したい問題を教えてください
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決方法
      description: 実現したい挙動やUI案、設定項目などを具体的に記載してください
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: 期待される効果
      description: 利用者にとってのメリットや改善点を教えてください
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案と互換性
      description: 他に試した方法や既存の回避策があれば記載してください 既存の設定・保存データ・利用者への影響も記載してください。
  - type: textarea
    id: scope
    attributes:
      label: スコープ・影響範囲
      description: 対象ページ、設定、モデル、ブラウザなどの影響範囲を明示してください
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 追加情報や関連Issue/PRがあれば記載してください
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
